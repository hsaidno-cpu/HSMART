name: Repository Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-governance:
    name: Repository Governance Review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run deterministic repository governance pre-review
        run: python scripts/repository-governance-review.py
      - name: Validate GitHub governance operator
        run: python -m pytest -q tests/test_github_governance.py
