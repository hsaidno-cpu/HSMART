name: SDGDS Migration PostgreSQL 16 Integration

on:
  pull_request:
    paths:
      - "examples/sdgds-migration-spike/**"
      - ".github/workflows/sdgds-migration-postgres.yml"
      - "docs/sdgds-migration/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdgds-migration-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-16-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sdgds_spike
          POSTGRES_USER: sdgds_spike
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdgds_spike -d sdgds_spike"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL test dependencies
        run: python -m pip install -r examples/sdgds-migration-spike/requirements-postgres.txt
      - name: Apply the migration and run PostgreSQL 16 integration tests
        working-directory: examples/sdgds-migration-spike
        env:
          SDGDS_TEST_DATABASE_URL: postgresql://sdgds_spike:disposable-ci-password@127.0.0.1:5432/sdgds_spike
          SDGDS_TEST_ALLOW_DESTRUCTIVE_RESET: "true"
        run: python -m pytest tests/test_postgres_integration.py -q
