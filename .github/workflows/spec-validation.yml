name: Specification Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-tests:
    name: Contract tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-app.txt

      - name: Bootstrap on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap-dev.ps1

      - name: Bootstrap on macOS/Linux
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/bootstrap-dev.sh

      - name: Install KM 1 application dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install -r requirements-app.txt

      - name: Install KM 1 application dependencies on macOS/Linux
        if: runner.os != 'Windows'
        shell: bash
        run: .venv/bin/python -m pip install -r requirements-app.txt

      - name: Record Windows toolchain versions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe --version
          & .\.venv\Scripts\python.exe -m pip --version

      - name: Record Unix toolchain versions
        if: runner.os != 'Windows'
        shell: bash
        run: |
          .venv/bin/python --version
          .venv/bin/python -m pip --version

      - name: Validate contracts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pip check
          & .\.venv\Scripts\python.exe scripts\validate-json.py
          & .\.venv\Scripts\python.exe -m pytest -q

      - name: Validate contracts on macOS/Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          .venv/bin/python -m pip check
          .venv/bin/python scripts/validate-json.py
          .venv/bin/python -m pytest -q

  repository-integrity:
    name: OpenAPI and required repository files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate OpenAPI YAML structure
        run: |
          ruby -ryaml -e '
            document = YAML.safe_load_file("docs/contracts/openapi.yaml", aliases: false)
            abort "OpenAPI document must be a mapping" unless document.is_a?(Hash)
            abort "Expected OpenAPI 3.1.0" unless document["openapi"] == "3.1.0"
            abort "Missing paths" unless document["paths"].is_a?(Hash)
            abort "Missing invoke endpoint" unless document["paths"].key?("/v1/invoke")
            abort "Missing capability discovery endpoint" unless document["paths"].key?("/v1/capabilities")
            abort "Missing bearer security scheme" unless document.dig("components", "securitySchemes", "bearerAuth").is_a?(Hash)
            puts "OpenAPI YAML parsed and required contract sections found"
          '

      - name: Check required architecture, governance and engineering files
        run: |
          test -s README.md
          test -s CONTRIBUTING.md
          test -s docs/architecture/HSMART-MASTER-ARCHITECTURE-SPECIFICATION.md
          test -s docs/architecture/DOMAIN-BOUNDARIES.md
          test -s docs/architecture/ECOSYSTEM-INTEGRATION.md
          test -s docs/access/UNIVERSAL-ACCESS-MANAGER.md
          test -s docs/security/THREAT-MODEL.md
          test -s docs/security/RISK-REGISTER.md
          test -s docs/data/DATA-MODEL.md
          test -s docs/contracts/openapi.yaml
          test -s docs/contracts/capability-manifest.schema.json
          test -s docs/contracts/event-envelope.schema.json
          test -s docs/foundation/HSMART-PROJECT-CHARTER.md
          test -s docs/foundation/CHARTER-RATIFICATION-RECORD.md
          test -s docs/foundation/MVP-DECISION-RECORD.md
          test -s docs/governance/ROLE-APPOINTMENT-REGISTER.md
          test -s docs/architecture/adr/ADR-011-implementation-stack-and-infrastructure.md
          test -s docs/planning/BACKLOG-KM0-KM2.md
          test -s docs/engineering/DEVELOPMENT-ENVIRONMENT.md
          test -s scripts/validate-json.py
          test -s tests/README.md
