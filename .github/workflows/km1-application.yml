name: KM1 Application Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  application-postgres:
    name: KM1 application integration (PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hsmart_test
          POSTGRES_USER: hsmart_test
          POSTGRES_PASSWORD: hsmart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hsmart_test -d hsmart_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hsmart_test:hsmart_test@localhost:5432/hsmart_test
      HSMART_TEST_POSTGRES_URL: postgresql+psycopg://hsmart_test:hsmart_test@localhost:5432/hsmart_test
      HSMART_ENV: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - name: Install pinned dependency-lock compiler
        run: python -m pip install pip-tools==7.7.0
      - name: Generate and verify application hash lock
        run: |
          pip-compile --generate-hashes --resolver=backtracking --output-file=requirements-app.lock requirements-app.txt
          if git ls-files --error-unmatch requirements-app.lock >/dev/null 2>&1; then
            git diff --exit-code -- requirements-app.lock
          fi
          echo HSMART_APP_LOCK_START
          cat requirements-app.lock
          echo HSMART_APP_LOCK_END
      - name: Install application and development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --require-hashes -r requirements-app.lock
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Verify migration rollback and reapply
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic current
      - name: Run application foundation tests
        run: python -m pytest -q tests/application
