services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hsmart_dev}
      POSTGRES_USER: ${POSTGRES_USER:-hsmart_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hsmart-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hsmart_dev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hsmart_dev}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
  api:
    build: .
    environment:
      HSMART_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hsmart_dev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hsmart_dev}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build: .
    environment:
      HSMART_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hsmart_dev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hsmart_dev}
    command: ["python", "-m", "hsmart_platform.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  hsmart-postgres:
